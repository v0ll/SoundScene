name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure native bridge
        run: cmake -S native/SoundScene.DaxBridge -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build native bridge
        run: cmake --build native/build

      - name: Restore, build, and test
        run: |
          # msvc-dev-cmd exports Platform=x64, which MSBuild applies to the
          # solution; the solution uses the default Any CPU platform.
          $env:Platform = "Any CPU"
          dotnet restore SoundScene.slnx
          dotnet build SoundScene.slnx -c Release --no-restore
          dotnet test SoundScene.slnx -c Release --no-build
