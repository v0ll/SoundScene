name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure native bridge
        run: cmake -S native/SoundScene.DaxBridge -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build native bridge
        run: cmake --build native/build

      - name: Restore
        run: dotnet restore SoundScene.slnx

      - name: Build
        run: dotnet build SoundScene.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SoundScene.slnx -c Release --no-build
