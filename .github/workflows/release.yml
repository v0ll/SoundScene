name: release

# Publishing happens here and only here. Local packages are for testing; the
# assets on a release are built from the tagged commit on a clean runner and
# carry a build provenance attestation that anyone can verify with:
#   gh attestation verify SoundScene-Setup-<version>.exe --repo v0ll/SoundScene

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v0.2.3
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.VersionPrefix | Select-Object -First 1
          $tagVersion = $env:TAG -replace '^v', ''
          if ($version -ne $tagVersion) {
              throw "Directory.Build.props says $version but the tag says $tagVersion."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Building SoundScene $version"

      - name: Configure native bridge
        run: cmake -S native/SoundScene.DaxBridge -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build native bridge
        run: cmake --build native/build

      - name: Restore, build, and test
        run: |
          # msvc-dev-cmd exports Platform=x64, which MSBuild applies to the
          # solution; the solution uses the default Any CPU platform.
          $env:Platform = "Any CPU"
          dotnet restore SoundScene.slnx
          dotnet build SoundScene.slnx -c Release --no-restore
          dotnet test SoundScene.slnx -c Release --no-build

      - name: Package
        shell: pwsh
        run: |
          $env:Platform = "Any CPU"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1 -Version $env:VERSION

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/SoundScene-Setup-*.exe
            dist/SoundScene-Portable-*.zip
            dist/SHA256SUMS.txt

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          $notes = "docs/release-notes/v$env:VERSION.md"

          gh release view $env:TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
              # A re-run must replace the assets, not fail on an existing release.
              gh release upload $env:TAG @assets --clobber
              exit $LASTEXITCODE
          }

          $arguments = @("release", "create", $env:TAG, "--title", "SoundScene $env:VERSION")
          if (Test-Path $notes) {
              $arguments += @("--notes-file", $notes)
          } else {
              $arguments += "--generate-notes"
          }
          $arguments += $assets
          gh @arguments
